name: Build NovaOS Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source/NovaOSLauncher/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: source/NovaOSLauncher
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaOSLauncher-debug-apk
          path: source/NovaOSLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
