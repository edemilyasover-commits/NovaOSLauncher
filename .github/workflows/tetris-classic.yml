name: Build Tetris Classic APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source/TetrisClassic/**"
      - ".github/workflows/tetris-classic.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: source/TetrisClassic
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TetrisClassic-debug-apk
          path: source/TetrisClassic/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
